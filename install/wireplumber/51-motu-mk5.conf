# MOTU UltraLite mk5 — WirePlumber device configuration (WirePlumber 0.5+)
#
# Native SPA-JSON port of 51-motu-mk5.lua. The .lua sibling is kept for
# WirePlumber 0.4; on 0.5 it is also loaded via the Lua compat shim, which
# applies the same properties again — harmless, but late. This file is what
# makes the pro-audio profile apply promptly during WirePlumber init.
#
# Node naming/routing is handled by the motu-mk5d audio router.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-MOTU_UltraLite.*"
      }
    ]
    actions = {
      update-props = {
        device.description = "MOTU UltraLite mk5"
        device.nick        = "MOTU mk5"
        device.profile-set = "motu-ultralite-mk5.conf"
        device.profile     = "pro-audio"
      }
    }
  }
  # Pro-audio ALSA nodes are externally managed; don't save/restore volume
  {
    matches = [
      {
        node.name = "~alsa_.*put.usb-MOTU_UltraLite.*"
      }
    ]
    actions = {
      update-props = {
        state.restore-props  = false
        state.restore-target = false
      }
    }
  }
]
